name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: macos-latest # Homebrew tests run best on macOS (or linux if your tools are purely linux)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.28.1
        
      - name: Run Brew Audit & Style Checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only check formulae added or modified (not deleted) since the base commit
          # Pushes to main use the pre-push commit; if it is missing (new branch,
          # force push), fall back to the parent commit, then to the empty tree.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse --verify -q HEAD^ || git hash-object -t tree /dev/null)"
          fi
          changed="$(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- 'Formula/*.rb')"

          if [ -z "$changed" ]; then
            echo "No formula changes to check."
            exit 0
          fi

          echo "Checking:"
          echo "$changed"

          formula_files=()
          formula_names=()
          while IFS= read -r formula; do
            formula_files+=("$formula")
            formula_name="${formula##*/}"
            formula_names+=("${formula_name%.rb}")
          done <<< "$changed"

          brew style "${formula_files[@]}"
          brew audit --strict --online "${formula_names[@]}"
